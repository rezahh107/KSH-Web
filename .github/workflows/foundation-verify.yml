name: Foundation Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-foundation:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up PHP verification runtime
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f
        with:
          php-version: '8.3'
          extensions: dom, libxml, mbstring, xmlreader
          tools: composer:v2
          coverage: none

      - name: Verify repository foundation and plugin
        shell: bash
        run: bash scripts/verify-foundation.sh
